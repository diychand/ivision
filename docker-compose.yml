version: "3.8"

services:
  db:
    image: postgres:15
    container_name: ivision-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ivision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ivision-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/ivision
      ALLOWED_ORIGINS: http://localhost:5173
      SECRET_KEY: your-secret-key-here
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/saved_models:/app/saved_models
      - ./backend/exports:/app/exports
      - ./backend/annotations:/app/annotations

  frontend:
    build: ./frontend
    container_name: ivision-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: